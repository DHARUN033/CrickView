version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: crickview-db
    restart: always
    environment:
      POSTGRES_USER: crickuser
      POSTGRES_PASSWORD: crickpassword
      POSTGRES_DB: crickview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: crickview-backend
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://crickuser:crickpassword@postgres:5432/crickview?schema=public
      PORT: 4000
      JWT_SECRET: supersecretproductionkey2026
      NODE_ENV: production
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: crickview-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
